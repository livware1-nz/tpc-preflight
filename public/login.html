<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPC Preflight — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0f0f;
      --paper: #f4f1eb;
      --red: #c0392b;
      --mid: #6b6b6b;
      --border: #d8d3c8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(192,57,43,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(15,15,15,0.04) 0%, transparent 50%);
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      background: var(--ink);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo-mark svg { display: block; }

    .brand-name {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--mid);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 24px;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: var(--mid);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--paper);
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: var(--ink); background: white; }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn:hover { background: #2a2a2a; }

    .error {
      background: #fdf0ee;
      border: 1px solid #f5c6c0;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-area">
      <div class="logo-mark">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect x="3" y="3" width="9" height="9" fill="white"/>
          <rect x="14" y="3" width="9" height="9" fill="white" opacity="0.5"/>
          <rect x="3" y="14" width="9" height="9" fill="white" opacity="0.5"/>
          <rect x="14" y="14" width="9" height="9" fill="white"/>
        </svg>
      </div>
      <div class="brand-name">The Print Company</div>
      <div class="brand-sub">Preflight System</div>
    </div>

    <div class="card">
      <h2>Sign in</h2>
      <p>Staff access only</p>

      <div id="error" class="error" style="display:none">Incorrect username or password</div>

      <form method="POST" action="/login">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
